model_engine_config:
  google/gemma-4-31B-it:
    chat_template_kwargs:
      enable_thinking: false
    thinking_control_label: DOCUMENTED_NON_THINKING_CONFIGURATION
    thinking_control_source: >-
      google/gemma-4-31B-it chat_template.jinja (Hugging Face, main branch):
      'enable_thinking' is set(enable_thinking | default(false)) and, when
      explicitly false, suppresses the '<|think|>' insertion at the system
      turn. Together's Chat Completions API documents chat_template_kwargs as
      an object passed through to the model engine (confirmed against the
      installed together-python 2.31.0 SDK type definitions). Together's
      google/gemma-4-31B-it serverless model page documents the model as
      supporting configurable thinking mode. Provider-side pass-through of
      chat_template_kwargs specifically for the Together Batch API endpoint
      has not been empirically confirmed; the one-request engineering
      capability preflight in outputs/together_smoke/tiny_pre_api verifies
      this before the 12-request first-wave smoke is ever submitted.

